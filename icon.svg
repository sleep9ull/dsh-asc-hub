<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="asc-hub">
  <!-- Original artwork, not Apple's asset: a single yellow A on a black tile. A narrow
       flat head, a narrow waist and a wide base — a trapezoid — with rounded shoulders,
       rounded feet and a bar across the legs. Every pair of edges is mirrored about
       x=32: base 16.5..47.5, head 27.5..36.5, legs with equal 11 x 27.6 slopes. -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#000000"/>
  <path d="M16.5 45.8 27.5 18.2H36.5L47.5 45.8" fill="none" stroke="#FFD60A" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="33.2" width="24" height="7.2" fill="#FFD60A"/>
</svg>
